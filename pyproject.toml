[project]
name = "lyric-study-pipeline"
version = "0.1.0"
description = "Automated music lyric, translation, and language-learning video pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "imageio-ffmpeg>=0.5.1",
    "mutagen>=1.47.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "syncedlyrics>=1.0.1",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
align = [
    "demucs>=4.0.1",
    "stable-ts>=2.16.0",
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git@7c66b95a8d69f5a34d02813bb6ed76c73ce8d887",
    "pykakasi>=2.3.0",
]

[tool.uv]
package = false
